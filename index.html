<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY WOLF // MOBILE TACTICAL HUD</title>
    <style>
        :root {
            --matrix-bg: #010810;
            --primary-hud: #00f0ff;
            --ready-state: #ff00dd;
            --search-state: #ffcc00;
            --alert-red: #ff3300;
            --panel-glass: rgba(2, 12, 24, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--matrix-bg);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Siber Arka Plan Izgarası */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 27, 41, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 27, 41, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .hud-container {
            width: 90%;
            max-width: 450px;
            background: var(--panel-glass);
            border: 2px solid var(--primary-hud);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Agency FB', sans-serif;
            font-size: 28px;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-hud);
        }

        .subtitle {
            font-size: 11px;
            color: var(--primary-hud);
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Durum Göstergesi */
        .status-box {
            border: 1px dashed var(--primary-hud);
            padding: 10px;
            margin-bottom: 25px;
            font-size: 13px;
            background: rgba(0, 240, 255, 0.02);
        }
        #status-text {
            color: var(--ready-state);
            font-weight: bold;
        }

        /* Taktik Buton Matrisi */
        .control-grid {
            display: grid;
            grid-template-columns: 1px 1px; /* Boşluk yönetimi */
            grid-auto-rows: auto;
            gap: 15px;
            display: flex;
            flex-direction: column;
        }

        .btn-tactic {
            background: rgba(1, 24, 40, 0.6);
            border: 1px solid var(--primary-hud);
            color: #ffffff;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 4px;
        }

        .btn-tactic:hover {
            background: var(--primary-hud);
            color: var(--matrix-bg);
            box-shadow: 0 0 15px var(--primary-hud);
        }

        /* Kritik Savunma Butonu */
        .btn-lock {
            border-color: var(--alert-red);
            color: #fff;
            background: rgba(40, 5, 5, 0.4);
        }
        .btn-lock:hover {
            background: var(--alert-red);
            color: #fff;
            box-shadow: 0 0 15px var(--alert-red);
        }

        /* Ses Barı Konteyneri */
        .slider-container {
            margin-top: 30px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            padding-top: 20px;
        }

        .slider-label {
            font-size: 12px;
            color: var(--text-intel);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #011828;
            border: 1px solid var(--primary-hud);
            outline: none;
            border-radius: 3px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-hud);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-hud);
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <div class="hud-container">
        <h1>SKY WOLF</h1>
        <div class="subtitle">Tactical Link Protocol // v42.0</div>

        <div class="status-box">
            SİNYAL DURUMU: <span id="status-text">BAĞLANTI HAZIR</span>
        </div>

        <div class="control-grid">
            <button class="btn-tactic" onclick="emirGonder('foto')">📷 SİBER GÖZ (FOTOĞRAF)</button>
            <button class="btn-tactic" onclick="emirGonder('video_kayit')">📹 UZAKTAN VİDEO RADARI (5 SN)</button>
            <button class="btn-tactic" onclick="emirGonder('ses_kayit')">🎙️ ORTAM AKUSTİK KAYDI (5 SN)</button>
            <button class="btn-tactic btn-lock" onclick="emirGonder('lock')">🔒 SİSTEMİ ACİL KİLİTLE</button>
        </div>

        <div class="slider-container">
            <div class="slider-label">ANLIK SES TELEMETRİSİ: <span id="vol-val">50</span>%</div>
            <input type="range" min="0" max="100" value="50" class="volume-slider" id="volSlider" oninput="sesGuncelle(this.value)">
        </div>
    </div>

    <script>
        // Sizin Firebase URL Yolunuz
        const FIREBASE_URL = "https://altay-43a7b-default-rtdb.firebaseio.com/sky_wolf_sistem/komut.json";

        function durumGuncelle(metin, renk) {
            const statusText = document.getElementById("status-text");
            statusText.innerText = metin;
            statusText.style.color = renk;
        }

        function emirGonder(emirAdi) {
            durumGuncelle("VERİ PAKETİ FIRLATILIYOR...", "#ffcc00");
            
            const veri = {
                emir: emirAdi,
                durum: "beklemede"
            };

            fetch(FIREBASE_URL, {
                method: "PUT",
                body: JSON.stringify(veri),
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(res => {
                if(res.ok) {
                    durumGuncelle("EMİR SİLİNDİ / İLETİLDİ", "#00ff66");
                    setTimeout(() => durumGuncelle("BAĞLANTI HAZIR", "#ff00dd"), 1500);
                } else {
                    durumGuncelle("BAĞLANTI HATASI", "#ff3300");
                }
            })
            .catch(err => {
                durumGuncelle("MATRİS SAPMASI", "#ff3300");
            });
        }

        // Kaydırıcı hareket ettikçe Firebase'e "volume_X" paketi atar
        let debounceTimer;
        function sesGuncelle(deger) {
            document.getElementById("vol-val").innerText = deger;
            
            clearTimeout(debounceTimer);
            // Sunucuyu yormamak için parmağınızı durdurduğunuz an veriyi ateşler
            debounceTimer = setTimeout(() => {
                emirGonder("volume_" + deger);
            }, 150);
        }
    </script>
</body>
</html>
